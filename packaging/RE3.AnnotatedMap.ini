; RE3 Annotated Map - settings / 설정 (UTF-8)
; Place beside RE3.AnnotatedMap.asi in the game folder. Close the game before editing, then restart it.
; 게임 폴더의 RE3.AnnotatedMap.asi 옆에 둡니다. 편집은 게임을 끈 뒤에 하세요.
; When upgrading keep YOUR existing INI: do not replace it with this file.
; 업그레이드할 때는 기존 INI를 이 파일로 덮어쓰지 마세요.
; Settings changed on the map are saved here automatically. 지도에서 바꾼 설정은 자동 저장됩니다.

[AnnotatedMap]
; Settings format, written by the mod. Do not edit. / 설정 형식 번호. 수정하지 마세요.
Version=4
; 1 = overlay on, 0 = off (all). / 지도 표시 전체 켜기·끄기. Default: 1. Key: 0
All=1
; Room names and save/item-box markers. / 방 이름, 타자기·아이템 상자. Default: 1. Key: 1
Rooms=1
; Locked doors and the key they need. / 잠긴 문과 필요한 열쇠. Default: 0. Key: 2
Locks=0
; Key items. / 핵심 아이템. Default: 0. Key: 3
KeyItems=0
; Files and area maps. / 문서와 지역 지도. Default: 0. Key: 4
Documents=0
; Puzzle markers (devices that need an item or a solution). / 퍼즐 표식. Default: 0. Key: 5
Puzzles=0
; Events: story scenes that can spoil (Live Selections). Hidden once seen. / 이벤트(스포일러가 되는 장면, 라이브 셀렉션). 한 번 지나면 사라짐. Default: 0. Key: 6
Events=0
; Ammo, recovery items, ribbons, gunpowder. / 탄약·회복·리본·화약. Default: 0. Key: 7
CommonItems=0
; Enemies. / 적. Default: 0. Key: 8
Monsters=0
; 1 = visited rooms, 2 = rooms revealed by a map, 3 = all rooms (spoilers). Key: 9. Default: 1.
; 1 = 가 본 방, 2 = 지도로 드러난 방, 3 = 모든 방(스포일러).
Scope=1
; en = English, ko = Korean (한국어). Key: \ (the won sign key on Korean keyboards). Default: en.
Language=en
; Name size 50-200 (steps of 10), 100 = standard. Keys: - and +. / 이름 크기. Default: 100.
NameSize=100
; Name opacity 10-100 (steps of 10). Keys: [ and ]. / 이름 불투명도. Default: 70.
NameOpacity=70
; Icon size 50-200 (steps of 10), 100 = standard for item icons. Keys: modifier + - and +. / 아이콘 크기. Default: 100.
IconSize=100
; Icon opacity 10-100 (steps of 10). Keys: modifier + [ and ]. / 아이콘 불투명도. Default: 100.
IconOpacity=100
; Item names: 0 = hidden, 1 = all, 2 = all except common items. Key: H cycles all -> no common -> hidden.
; 아이템 이름: 0 = 숨김, 1 = 모두, 2 = 일반 아이템 제외. H 키로 전환. Default: 0.
ItemNames=0
; Legend and value panel, 1 = shown. Key: ~. / 범례·수치 패널. Default: 1.
Legend=1
; Key held for the icon keys: Shift or Ctrl. / 아이콘 키 조합: Shift 또는 Ctrl. Default: Shift.
Modifier=Shift
; Lock markers: Door = on the door, Unvisited = in the room not entered yet. / 잠긴 문 표식 위치. Default: Door.
LockMarker=Door
